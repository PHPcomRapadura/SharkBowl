services:
  pocketbase:
    image: alpine:3.21
    entrypoint: ["/bin/sh", "/pb/bootstrap.sh"]
    command: ["serve", "--http=0.0.0.0:8090", "--dir=/pb/pb_data", "--hooksDir=/pb/hooks", "--migrationsDir=/pb/migrations", "--publicDir=/pb/public", "--automigrate=false", "--hooksWatch=false"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POCKETBASE_PORT:-8090}:8090"
    volumes:
      - pocketbase_data:/pb/pb_data
      - pocketbase_binary:/pb/bin
      - ./pocketbase/bootstrap.sh:/pb/bootstrap.sh:ro
      - ./pocketbase/hooks:/pb/hooks:ro
      - ./pocketbase/migrations:/pb/migrations:ro
      - ./dist/client:/pb/public:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  pocketbase_data:
  pocketbase_binary:
